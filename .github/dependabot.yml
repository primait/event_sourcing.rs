version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  commit-message:
    prefix: "chore(deps-cargo)"
  groups:
    cargo-non-major:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
- package-ecosystem: docker
  directories:
    - "*"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "chore(deps-docker)"
  groups:
    docker-non-major:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "chore(deps-github-actions)"
  groups:
    github-actions-non-major:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
