version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: daily
- package-ecosystem: docker
  directories:
    - "*"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  ignore:
    - dependency-name: "*"
      update-types:
        - "version-update:semver-major"
